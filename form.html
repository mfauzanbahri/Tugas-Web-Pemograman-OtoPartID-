<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tambah Data - OtoPartID</title>
</head>
<body>
    <header>
        <h1>OtoPartID</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Kembali ke Beranda</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Form Tambah Data Sparepart</h2>
            <p>Silakan isi formulir di bawah ini untuk menambahkan komponen baru ke katalog.</p>
            
            <form action="index.html" method="GET">
                <div>
                    <!-- Atribut for pada label harus sama dengan id pada input -->
                    <label for="kodeOem">Kode OEM / Part Number:</label><br>
                    <input type="text" id="kodeOem" name="kodeOem" placeholder="Contoh: 15601-BZ010" required>
                </div>
                <br>

                <div>
                    <label for="namaPart">Nama Sparepart:</label><br>
                    <input type="text" id="namaPart" name="namaPart" required>
                </div>
                <br>

                <div>
                    <label for="kategori">Kategori Komponen:</label><br>
                    <select id="kategori" name="kategori">
                        <option value="pengereman">Sistem Pengereman</option>
                        <option value="oli">Oli & Pelumas</option>
                        <option value="kelistrikan">Kelistrikan & Busi</option>
                        <option value="filter">Filter & Udara</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="hargaTermurah">Estimasi Harga Termurah (Rp):</label><br>
                    <input type="number" id="hargaTermurah" name="hargaTermurah" min="0" required>
                </div>
                <br>

                <div>
                    <label for="deskripsi">Deskripsi & Kecocokan Kendaraan:</label><br>
                    <textarea id="deskripsi" name="deskripsi" rows="4" cols="50" placeholder="Jelaskan spesifikasi dan daftar motor/mobil yang cocok..."></textarea>
                </div>
                <br>

                <div>
                    <button type="submit">Simpan Data</button>
                    <button type="reset">Hapus Isian</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 OtoPartID - Tugas Pemrograman Web - Muhammad Fauzan Bahri</p>
    </footer>
</body>
</html>
